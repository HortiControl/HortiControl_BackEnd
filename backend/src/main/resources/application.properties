spring.application.name=horticontrol

# Configurações MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/horticontrol
spring.datasource.username=adm
spring.datasource.password=horticontrol
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true

# JWT
# Chave secreta em Base64 com 256 bits (32 bytes) â€” obrigatÃ³rio para HS256
# Para gerar uma nova chave: echo -n "sua-chave-de-32-caracteres-aqui!!" | base64
# Em producao, use variavel de ambiente: ${JWT_SECRET}
jwt.secret=c2VjcmV0LWNoYXZlLXNlZ3VyYS1ob3J0aWNvbnRyb2wtMjAyNg==
# Expiracao em milissegundos: 86400000 = 24 horas
jwt.expiration=86400000

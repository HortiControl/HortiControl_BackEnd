spring.application.name=horticontrol
spring.profiles.active=dev

# JPA (comum a todos os ambientes)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Validade do JWT em milissegundos.
# O padrão abaixo representa um dia.
# JWT (estrutura comum)
jwt.expiration=86400000

# Chave secreta Base64 usada para assinar os JWTs.
# A chave real deve ser fornecida por variável de ambiente.
jwt.secret=${JWT_SECRET}


# Sistema responsável por emitir o JWT.
jwt.issuer=${JWT_ISSUER:hortcontrol-api}

# Aplicação para a qual o JWT foi criado.
jwt.audience=${JWT_AUDIENCE:hortcontrol-web}

# Tolerância para diferenças de relógio entre servidores.
jwt.clock-skew-seconds=${JWT_CLOCK_SKEW_SECONDS:30}



#CONFIGURAÇÕES DO COOKIE!!!!!

# Em produção deve permanecer true.
# Em desenvolvimento local usando HTTP, utilize false.
app.auth.cookie.secure=${AUTH_COOKIE_SECURE:true}

# Utilize Strict quando frontend e API estiverem no mesmo site.
# Utilize None quando estiverem em sites diferentes.
app.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Strict}



# Tabela de decisão
# Ambiente visto pelo navegador	AUTH_COOKIE_SECURE	AUTH_COOKIE_SAME_SITE
# Local usando http://localhost	false	Strict
# AWS com app.horticontrol.com e api.horticontrol.com	true	Strict
# AWS com frontend e API na mesma origem	true	Strict
# Frontend na Vercel e backend na AWS	true	None
# Frontend no CloudFront e API em domínio AWS diferente


